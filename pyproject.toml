[project]
name = "dodo-audit-service"
version = "0.1.0"
description = "Сервис выездных проверок пиццерий: телеграм-бот фиксации нарушений, расчёт оценки и сборка отчёта"
requires-python = ">=3.12"

# Зависимости продукта добавляет тот блок, который начинает их использовать —
# тогда проверка неиспользуемых зависимостей (deptry) остаётся живой, а не
# заглушённой списком «объявлено на будущее». Выбранные версии и обоснование —
# docs/forge/plan.md, раздел «Стек с обоснованием».
# Версии прибиваются точно (==): pip не умеет карантин свежих версий, поэтому
# обновление — отдельное осознанное изменение, а не автоподтягивание.
dependencies = [
    # Движок: сборка PDF (D009 — рендерер зафиксирован на WeasyPrint 69.x),
    # сжатие фотографий в отчёте и импорт чек-листа из xlsx в manage.py.
    "weasyprint==69.0",
    "pillow==12.3.0",
    "openpyxl==3.1.5",
    # recognize: единственный провайдер LLM — OpenAI (решение D010). Один
    # клиент закрывает и разбор комментариев, и транскрипцию голоса.
    "openai==2.9.0",
    # Блок bot: диалог с аудитором (docs/forge/plan.md, раздел «Стек»).
    "aiogram==3.31.0",
    # db: слив завершённой проверки в Postgres (D027, D053). Синхронный
    # драйвер — блок звонит в базу так же прямолинейно, как domain вызывает
    # движок подпроцессом; асинхронный стек здесь не по адресу, потому что
    # весь остальной код блоков синхронный (см. `openai.OpenAI`, не
    # `AsyncOpenAI`, в src/recognize/client.py). Миграции — не Alembic:
    # добавлять SQLAlchemy ради восьми таблиц и тянуть следом psycopg2
    # (postgres-экстра yoyo-migrations на нём, не на psycopg3) означало бы
    # два драйвера Postgres в одном проекте. Простые пронумерованные .sql
    # файлы и раннер на полсотни строк (src/db/migrate.py) дают то же самое
    # без лишней зависимости.
    "psycopg[binary]==3.2.13",
    # db: выгрузка кадров в хранилище (T094, D054). Клиент S3, а не SDK
    # конкретного поставщика: привязываться к Supabase нельзя (D061), а
    # S3-совместимый интерфейс есть и у него, и у AWS, и у локального сервера
    # — переезд остаётся правкой переменных окружения (D004). boto3 говорит с
    # чужим сервером через `endpoint_url` и сам переключается на path-style
    # адресацию, когда адрес не похож на AWS. Альтернатива `minio` легче втрое
    # (2,9 МБ против 15 МБ с botocore) и несёт свои типы, но её тестового
    # двойника без поднятого сервера нет: moto подменяет именно botocore,
    # поэтому с ней прогон блока потребовал бы Docker и пропускался бы там,
    # где его нет.
    "boto3==1.43.87",
    # Объявлен явно, потому что импортируется напрямую: драйвер хранилища
    # переводит исключения botocore в отказ блока на своей же границе
    # (src/db/storage.py). Версия та же, что тянет boto3 этого выпуска.
    "botocore==1.43.87",
    # infra: подставляет переменные из `.env` в окружение процесса при
    # локальном запуске `python -m src.bot` без Docker (issue #75) — точка
    # входа читала только `os.environ`, а класть туда файл было некому.
    # Внутри контейнера переменные уже приходят через `docker compose`
    # (`env_file`/`environment`), и там `load_dotenv()` просто не находит
    # файла — вызов безопасен в обоих случаях (docs/forge/blocks/infra.md).
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
    "mypy==1.19.1",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    # Прямой импорт в sitecustomize.py: подпроцессы движка подхватывают покрытие
    # через coverage.process_startup(). Транзитивной зависимости pytest-cov тут
    # мало — deptry прав, импорт явный и версия должна быть объявлена (T037).
    "coverage==7.15.4",
    "pytest-asyncio==1.4.0",
    "vulture==2.14",
    "deptry==0.23.1",
    "import-linter==2.3",
    # Хранилище S3 в прогоне не поднимается: moto подменяет его внутри
    # процесса, включая обращения на явно заданный `endpoint_url`
    # (MOTO_S3_CUSTOM_ENDPOINTS) — то есть проверяется тот же путь, которым
    # продукт пойдёт к своему хранилищу. Экстра `s3`, а не `server`: серверный
    # режим тянет flask, docker и cfn-lint, а живой HTTP-порт здесь не нужен.
    "moto[s3]==5.2.3",
    # Типы для boto3: своих он не несёт, и без них `mypy --strict` отказывается
    # разбирать модуль целиком.
    "boto3-stubs[s3]==1.43.87",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ исключены: ruff форматирует python-блоки внутри markdown,
# а документы кодом проекта не являются.
exclude = [".venv", "docs", "engine"]

[tool.ruff.lint]
# Наборы включены явным списком, а не пресетом: пресеты шире канона проекта
# и дают по два сообщения на одну строку от пересекающихся правил.
select = ["E", "F", "I", "B", "S", "ASYNC", "RUF"]
# Проект пишет тексты, имена тестов и комментарии по-русски. RUF001–RUF003
# ловят кириллические буквы, похожие на латинские (о, а, е, р, с…), и на
# русском тексте срабатывают десятками на файл — 65 сообщений на первых же
# тестах движка. Правило защищает от гомоглифов в англоязычном коде; здесь
# кириллица осмысленная, поэтому проверка выключена целиком, а не списком
# отдельных букв, который заведомо окажется неполным.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# assert в тестах — это их работа; S105/S106 в них срабатывают на выдуманных
# токенах вида "123:abc", без которых тест окружения бота не написать.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["engine", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Хендлеры и мидлвари бота — корутины (aiogram); markers, а не auto-режим, чтобы
# синхронные тесты domain и движка не проверялись случайно как асинхронные.
asyncio_mode = "strict"
# Покрытие считается по src/. Движок в метрику не входит осознанно: тесты
# запускают его подпроцессом через CLI, и построчное покрытие дочернего процесса
# не видно без отдельной настройки (задача T037). Проверен он при этом хорошо —
# 88 функциональных тестов гоняют его команды.
addopts = "--cov=src --cov-report=term-missing --junitxml=reports/junit.xml"

[tool.coverage.run]
source = ["src"]

[tool.vulture]
# Тесты сканируются вместе с исходниками не для проверки самих тестов, а чтобы
# они считались потребителем кода: публичный контракт блока `domain` сегодня
# зовут только они — `bot`, `recognize` и `report` появятся позже. Без этого
# проверка сводилась бы к списку исключений на весь контракт и перестала бы
# что-либо ловить. Так она осталась живой: на этом наборе она нашла настоящий
# мёртвый код (`Finding.is_violation`), и он удалён, а не занесён в исключения.
paths = ["src", "tests", ".vulture-ignore"]
min_confidence = 60  # 80 не ловит неиспользуемые функции — проверено порчей
# `pytestmark` читает pytest при сборе тестов, в коде на него никто не ссылается.
# `__getattr__` (src/db/__init__.py) — хук PEP 562, интерпретатор вызывает его
# сам на `from src.db import push_inspection`; в коде по имени не зовётся.
ignore_names = ["pytestmark", "__getattr__"]
exclude = [".venv"]

[tool.deptry]
# `audit` — модуль движка, который report.py и manage.py импортируют через
# sys.path, а не как пакет; для deptry он свой, а не внешняя зависимость.
known_first_party = ["src", "audit"]
# engine/ сканируется: иначе объявленные зависимости движка выглядят
# неиспользуемыми, и проверку пришлось бы глушить списком исключений.
extend_exclude = ["^\\.venv/", "^tests/"]

# Инструменты проверок не импортируются кодом — они запускаются командами.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    # Плагин pytest: подключается самим pytest по entry point, в коде не импортируется.
    "pytest-asyncio",
    "vulture",
    "deptry",
    "import-linter",
    # Подменяет S3 в тестах; тесты для deptry исключены, поэтому импорта он
    # не видит.
    "moto",
    # Пакет типов: его «импортирует» mypy, а не код.
    "boto3-stubs",
]

[tool.importlinter]
root_packages = [
    "src",
]
# Нужно, чтобы контракт про engine видел внешний по отношению к src пакет.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Блоки идут слоями, обратный импорт запрещён"
type = "layers"
layers = [
    "src.bot",
    # db — пир recognize/report: тоже читает состояние и оценку только через
    # официальный контракт domain (get_state, score), сам движок не вызывает
    # и не импортируется другими блоками этого яруса.
    "src.recognize : src.report : src.db",
    "src.domain",
]

[[tool.importlinter.contracts]]
name = "Движок вызывается подпроцессом, а не импортируется"
type = "forbidden"
source_modules = [
    "src.bot",
    "src.recognize",
    "src.report",
    "src.db",
]
forbidden_modules = [
    "engine",
]
